# This workflow is used for testing the aws terraform module.

name: AWS Tests
on:
  push:
    paths:
      - 'aws/tf/**'
      - '.github/workflows/aws-test.yml'
  pull_request:
    paths:
      - 'aws/tf/**'
      - '.github/workflows/aws-test.yml'
jobs:
  test-aws:
    uses: ./.github/workflows/terraform-ruw.yml
    with:
      terraform_fmt_check: true
      terraform_test_args: "-filter=tests/mock_plan.tftest.hcl -filter=tests/mock_plan_gov.tftest.hcl -filter=tests/mock_plan_serverless.tftest.hcl"
      terraform_validate_enabled: true
      tflint_args: "--config=$(pwd)/.tflint.hcl"
      # aws_account_id defaults to null for SERVERLESS mode, and TFLint's AWS IAM/KMS policy rules fail to evaluate
      # "${var.aws_account_id}" templates when it is null. A placeholder account ID keeps those rules running. It is
      # passed as TF_VAR_ rather than --var because --recursive also lints modules that do not declare the variable.
      tflint_env: "TF_VAR_aws_account_id=123456789012"
      working_directory: aws/tf
